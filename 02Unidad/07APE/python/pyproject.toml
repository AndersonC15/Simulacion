[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ape07-montecarlo"
version = "1.0.0"
description = "APE 07 de Simulación: estimación de pi mediante Monte Carlo"
requires-python = ">=3.11"

[project.scripts]
ape07 = "ape07.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
