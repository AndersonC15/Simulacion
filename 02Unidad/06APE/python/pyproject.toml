[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ape06-simulacion"
version = "1.0.0"
description = "Practica 06: validacion de un LCG en Python y Java"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4", "scipy==1.18.1", "pandas==3.1.1",
    "matplotlib==3.11.2", "reportlab==5.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
ape06 = "ape06.__main__:main"
ape06-comparar = "ape06.controlador.entrega:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
